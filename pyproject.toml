[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Installed from git or a checkout, so the name only has to be unique on this
# machine. Publishing to PyPI will need a different one: `lamina` there is an
# unrelated Pygame/OpenGL project.
name = "lamina"
version = "0.1.0"
description = "Publish long-form Markdown as a plain static site"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py~=4.2",
    "mdit-py-plugins~=0.6",
    "linkify-it-py~=2.2",
    "msgspec>=0.22.0",
]

[project.scripts]
lamina = "lamina:main"

[tool.hatch.build.targets.wheel]
packages = ["lamina"]

[dependency-groups]
dev = ["mypy>=1.14", "ruff>=0.8"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["lamina"]

[tool.ruff.lint]
extend-select = ["I", "UP"]
# a page's date is the author's local day (DTZ011); fetch_link and cmd_watch
# catch everything on purpose: any failure means no preview / keep watching
ignore = ["DTZ011", "BLE001"]

[tool.ruff.lint.isort]
lines-after-imports = 1
