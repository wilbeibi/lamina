# lamina site config. Categories are directories under pages/; the first one is
# the landing page. Everything else has a default.
# Math uses Temml automatically; self-host with temml.min.js, Temml-Local.css
# and Temml.woff2 in theme/.
# Image zoom and local media checks are automatic.
# Code copying, heading permalinks and table sorting need no settings.
# Sorting ignores annotations; math previews use the page's global TeX macros.
name = "lamina"
description = "an example site showing every lamina feature"
url = "https://lamina-demo.pages.dev" # the live build of this example site
footer = '<a href="https://github.com/wilbeibi/lamina">source</a>'  # HTML, appended to every footer

[langs.zh]           # en is built in; every other language needs its UI strings
name = "中文"
updated = "更新"
missing = "暂无{name}版"
contents = "目录"
pinned = "置顶"

[[category]]
dir = "notes"
title = "notes"
description = "notes, plans, and things being figured out"
pinned = ["glossary"] # slugs in display order; remaining notes stay newest first

[[category]]
dir = "reports"
title = "reports"
description = "longer write-ups, Chinese canonical with English translations"
lang = "zh"
translations = ["en"]
