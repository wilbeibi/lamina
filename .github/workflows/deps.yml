# A Dependabot pull request merges itself when lint passes and example/public
# builds byte-identical to main's. Any other waits for a person.
name: deps
on: pull_request
permissions: {}
jobs:
  verify:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_LOCKED: 1  # build what uv.lock says, never rewrite it
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # page dates come from git log
      - run: pipx install uv
      - run: make lint
      - run: make && mv example/public /tmp/head
      # the checkout is the pull request merged into main; its first parent is main
      - run: git checkout --detach HEAD^1 && make && diff -r example/public /tmp/head
  merge:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - run: gh pr merge --rebase "$PR"
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
