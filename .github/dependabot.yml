# One pull request per outdated Python package, on the first of each month;
# workflows/deps.yml merges the ones that change nothing. Pele, Temml and
# Prism are pinned in lamina/build.py and lamina/theme/prism.js, which
# Dependabot cannot read: AGENTS.md, "Updating dependencies".
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    # leave a pyproject.toml range alone unless the release falls outside it
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: deps
